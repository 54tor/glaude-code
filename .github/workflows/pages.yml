name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          set -eu
          mkdir -p _site/shots
          cp -r site/. _site/
          for shot in bureau-sessions bureau-conversation mobile-sessions mobile-conversation mobile-permissions; do
            cp "docs/screenshots/${shot}.png" _site/shots/
          done
      - name: Check local references
        run: |
          set -eu
          missing=0
          while IFS= read -r page; do
            dir=$(dirname "$page")
            while IFS= read -r ref; do
              target="$dir/$ref"
              case "$ref" in */) target="${target}index.html" ;; esac
              if [ ! -e "$target" ]; then
                echo "::error file=$page::missing $ref"
                missing=1
              fi
            done < <(grep -oE '(src|href)="[^"#:]+"' "$page" | sed -E 's/^[a-z]+="([^"]*)"$/\1/')
          done < <(find _site -name '*.html')
          exit "$missing"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
