name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # chaque lundi : fuzzing plus long et nouvelles vulnérabilités connues
permissions:
  contents: read
jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks parcourt tout l'historique
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gld/go.mod
          cache-dependency-path: gld/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gld/ui/package-lock.json
      - run: sudo apt-get install -y --no-install-recommends tmux # le test d'envoi réel vers tmux ne doit pas être sauté en CI
      - run: cd gld && go vet ./...
      - run: make check-ui
      - run: test -z "$(gofmt -s -l gld)"
      - name: staticcheck (linux, windows, darwin)
        working-directory: gld
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for os in linux windows darwin; do GOOS=$os "$(go env GOPATH)/bin/staticcheck" ./... || exit 1; done
      - name: govulncheck
        working-directory: gld
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
      - run: make cover
      - name: couverture de l'interface
        working-directory: gld/ui
        run: npm run coverage
      - run: cd gld/ui && npm audit --omit=dev
      - name: fuzzing
        run: make fuzz FUZZTIME=${{ github.event_name == 'schedule' && '5m' || '15s' }}
