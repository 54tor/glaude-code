      - admin
      operationId: putAdminAcl
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                home_id:
                  type: string
                grant:
                  type: array
                  items: {}
                revoke:
                  type: array
                  items: {}
                confirm:
