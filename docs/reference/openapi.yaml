components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gld_session
      description: Multi-user mode session cookie. Unsafe methods must also send the X-Gld-CSRF header returned at login.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Gld-CSRF
      description: CSRF token paired with the session cookie, required on POST, PUT, PATCH and DELETE.
    bearerAuth:
      type: http
      scheme: bearer
      description: Host token (single-user token mode) or API token; a shared-session guest uses its own cookie plus the X-Gld-Share
        header.
  responses:
    Error:
      description: Uniform error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BulkResult:
      type: object
      required:
      - done
      - failed
      properties:
        done:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required:
            - item
            - error
            properties:
              item:
                type: string
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        message:
          type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable snake_case slug, e.g. bad_request, bad_id, unauthorized, forbidden, not_found, conflict, too_large,
                unsupported, rate_limited, internal, unavailable, too_many_items.
            message:
              type: string
              description: Localized human text.
            etag:
              type: string
              description: Only on the 409 of PUT /v1/fs/entries/content. Current disk etag, empty when the file is gone.
            deleted:
              type: boolean
              description: Only on the 409 of PUT /v1/fs/entries/content. True when the file no longer exists.
