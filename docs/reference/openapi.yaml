openapi: 3.0.3
info:
  title: gld API
  version: v1
  description: 'Contract of the gld HTTP API, served under /v1. Breaking change from the former RPC routes: no alias remains. Success
    responses are the resource JSON (no ok envelope); every failure is {"error":{"code","message"}} with the real HTTP status. Request
    and response bodies are described as generic objects: the exact fields live in the handlers and in gld/ui/src/lib/api.ts. Parameters
    and status codes are extracted from the handlers. x-gld-right is the right required in multi-user mode; x-gld-guest marks routes
    a shared-session guest may call (the session id in the path is rewritten from the share, never read from the client). Re-authenticated account actions (factor removal, session revocation, admin MFA reset) are POST sub-resources on purpose: the
    re-authentication is a JSON body, and proxies or WAFs may strip DELETE bodies. Multi-item
    requests (repeated item query parameter, or items in the body) accept at most 100 items, error code too_many_items beyond; the web UI sends
    larger lists in successive batches so the URL stays under about 8 KB behind proxies.'
servers:
- url: /
security:
- cookieAuth: []
  csrfHeader: []
- bearerAuth: []
paths:
  /v1/account:
    get:
      tags:
      - account
      operationId: getAccount
      x-gld-right: usage_read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/account/refreshes:
    post:
      tags:
      - account
      operationId: postAccountRefreshes
      x-gld-right: usage_read
      responses:
        '200':
